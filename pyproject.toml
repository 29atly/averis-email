[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "averis-email"
version = "0.1.0"
description = "Starter pipeline for email document comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24,<2",
]

[project.scripts]
averis-extract-pdf = "averis_email.stages.extraction:main"

[tool.setuptools.packages.find]
where = ["src"]
