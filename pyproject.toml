[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "averis-email"
version = "0.1.0"
description = "Starter pipeline for email document comparison"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "google-genai>=0.3",
    "python-dotenv>=1.0,<2",
    "PyMuPDF>=1.24,<2",
    "numpy>=1.26",
    "openpyxl>=3.1,<4",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
ocr = ["paddleocr>=3.7,<3.8", "paddlepaddle>=3.3,<4"]
laya = ["laya==0.3.4", "transformers>=4.45,<5"]

[project.scripts]
averis-extract-file = "averis_email.extraction_pipeline.__main__:main"
averis-classify-laya = "averis_email.laya_classifier.cli:main"
averis-classify-email = "averis_email.llm_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
